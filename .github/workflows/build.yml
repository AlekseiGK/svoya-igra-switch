name: Build Switch .nro

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Установить SDL2-порты для Switch
        run: |
          (sudo dkp-pacman -Sy --noconfirm switch-sdl2 switch-sdl2_ttf) || \
          (dkp-pacman -Sy --noconfirm switch-sdl2 switch-sdl2_ttf)

      - name: Собрать .nro
        run: make

      - name: Загрузить готовый .nro как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: svoya-igra-nro
          path: svoya-igra.nro
