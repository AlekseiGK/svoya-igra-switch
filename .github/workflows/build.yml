name: Build Switch .nro

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Диагностика окружения
        run: |
          echo "== whoami =="; whoami || true
          echo "== DEVKITPRO =="; echo "$DEVKITPRO"
          echo "== which pacman / dkp-pacman / sudo =="
          which pacman || echo "pacman НЕ найден"
          which dkp-pacman || echo "dkp-pacman НЕ найден"
          which sudo || echo "sudo НЕ найден"
          echo "== ls \$DEVKITPRO =="; ls -la "$DEVKITPRO" || true

      - name: Установить SDL2-порты для Switch
        run: |
          set -x
          if command -v dkp-pacman >/dev/null 2>&1; then PACMAN=dkp-pacman
          elif command -v pacman >/dev/null 2>&1; then PACMAN=pacman
          else echo "НИ pacman, НИ dkp-pacman не найдены" >&2; exit 1
          fi
          if command -v sudo >/dev/null 2>&1; then
            sudo "$PACMAN" -Sy --noconfirm switch-sdl2 switch-sdl2_ttf
          else
            "$PACMAN" -Sy --noconfirm switch-sdl2 switch-sdl2_ttf
          fi

      - name: Скачать шрифты DejaVu Sans (кириллица)
        run: |
          (sudo apt-get update -qq) || apt-get update -qq
          (sudo apt-get install -y -qq fonts-dejavu-core) || apt-get install -y -qq fonts-dejavu-core
          mkdir -p romfs/fonts
          cp /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf romfs/fonts/
          cp /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf romfs/fonts/

      - name: Собрать .nro
        run: make

      - name: Загрузить готовый .nro как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: svoya-igra-nro
          path: svoya-igra.nro
