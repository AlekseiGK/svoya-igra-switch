name: Build Switch .nro

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Установить SDL2-порты для Switch
        run: |
          (sudo dkp-pacman -Sy --noconfirm switch-sdl2 switch-sdl2_ttf) || \
          (dkp-pacman -Sy --noconfirm switch-sdl2 switch-sdl2_ttf)

      - name: Скачать шрифты DejaVu Sans (кириллица)
        run: |
          (sudo apt-get update -qq) || apt-get update -qq
          (sudo apt-get install -y -qq fonts-dejavu-core) || apt-get install -y -qq fonts-dejavu-core
          mkdir -p romfs/fonts
          cp /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf romfs/fonts/
          cp /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf romfs/fonts/

      - name: Собрать .nro
        run: make

      - name: Загрузить готовый .nro как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: svoya-igra-nro
          path: svoya-igra.nro
